<html lang="fr">
<head>

<title>Accès refusé — Mission Poilus</title>
<link rel="icon" href="favicon-512.png" />
<style>
  :root { --bleu: #232B45; --bleu2: #1a2038; --orange: #F28C28; }

  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;

  }
  .carte {
    background: rgba(255,255,255,0.06); border-radius: 24px; padding: 38px 30px; max-width: 520px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.35);
  }
  .code { font-size: 3rem; font-weight: 800; color: var(--orange); line-height: 1; }
  h1 { font-size: 1.3rem; margin: 14px 0 10px; }
  p { color: rgba(255,255,255,0.85); line-height: 1.6; margin: 0 0 20px; }
  a.bouton {
    display: inline-block; background: var(--orange); color: #fff; text-decoration: none;
    font-weight: 700; padding: 12px 22px; border-radius: 999px;
  }
  a.lien { color: rgba(255,255,255,0.8); display: block; margin-top: 16px; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="carte">
    <div class="code">403</div>
    <h1>Accès refusé</h1>
