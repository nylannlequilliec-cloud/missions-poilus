# Configuration Netlify — Mission Poilus (site 100% statique, pas de build)
[build]
  command = ""
  publish = "."

# En-têtes de sécurité (X-Frame-Options impossible en <meta>, ici via hébergement)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images : cache long (fichiers versionnés par nom de prise de vue, contenu stable)
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ============================================================
# URL canoniques — une seule forme : /page.html
# Constat du 21/09/2026 : Netlify sert AUSSI les variantes sans extension (Pretty URLs) en 200,
# donc /taxi-animalier ET /taxi-animalier.html répondaient tous les deux (contenu dupliqué).
# Ces redirections 301 renvoient chaque variante vers la forme déclarée en canonical, au sitemap
# et dans les liens internes. Ne pas modifier sans mettre à jour canonical et sitemap.
# ============================================================

[[redirects]]
  from = "/assurance"
  to = "/assurance.html"
  status = 301
  force = true

